# The content of the site. Everything about a library (description, version, docs)
# is read from its repository at its highest release tag.

[site]
title = "offerrall"
description = "Libraries by offerrall."
url = "https://offerrall.github.io"
links = [
  { name = "GitHub", url = "https://github.com/offerrall" },
  { name = "PyPI", url = "https://pypi.org/user/offerrall/" },
]

# The libraries, in order. Libraries with the same group are listed together.
# name_predates_convention marks a library named before the naming rule; PyPI names cannot change.
[[lib]]
repo = "offerrall/pycodecad"
group = "CNC, laser & CAD"

[[lib]]
repo = "offerrall/PyGrbl_Streamer"
name_predates_convention = true
group = "CNC, laser & CAD"

[[lib]]
repo = "offerrall/pyeasydeploy"
group = "Deployment"

[[lib]]
repo = "offerrall/pygrbl_build"
name_predates_convention = true
group = "CNC, laser & CAD"

[[lib]]
repo = "offerrall/pytypehint"
group = "Types & forms"

[[lib]]
repo = "offerrall/pytypehintstore"
group = "Types & forms"

[[lib]]
repo = "offerrall/pytypehintweb"
group = "Types & forms"

[[lib]]
repo = "offerrall/FuncToWeb"
name_predates_convention = true
group = "Web"
