<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<meta name="color-scheme" content="light dark">
{% block alternate %}<link rel="alternate" type="text/markdown" href="/llms.txt">{% endblock %}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>document.documentElement.classList.add("js")</script>
<script src="/site.js" defer></script>
</head>
<body>
{% block body %}{% endblock %}
<footer class="status">
  <span class="mode">{% block mode %}{% endblock %}</span>
  <span id="status-msg" aria-live="polite">{% block message %}{% endblock %}</span>
  <span class="keys">{% block keys %}{% endblock %}</span>
</footer>
</body>
</html>
